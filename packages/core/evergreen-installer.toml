[package]
name = "evergreen-installer"
version = "0.1.0"
arch = "x86_64"
description = "Evergreen Linux installer (GTK4 + TUI)"
license = "MIT OR Apache-2.0"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
path = "../.."

[build]
script = """
set -eu
cargo build --release -p evergreen-installer --features gtk --target-dir "$SRC/target/stage1"
install -Dm755 "$SRC/target/stage1/release/evergreen-installer" "$DESTDIR/usr/bin/evergreen-installer"
"""

[stage1]
stage = 1
build_deps = ["eva", "gtk4"]
