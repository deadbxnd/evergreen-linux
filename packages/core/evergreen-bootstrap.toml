[package]
name = "evergreen-bootstrap"
version = "0.1.0"
arch = "x86_64"
description = "Evergreen Linux bootstrapper"
license = "MIT OR Apache-2.0"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
path = "../.."

[build]
script = """
set -eu
cargo build --release -p evergreen-bootstrap --target-dir "$SRC/target/stage1"
install -Dm755 "$SRC/target/stage1/release/evergreen-bootstrap" "$DESTDIR/usr/bin/evergreen-bootstrap"
"""

[stage1]
stage = 1
build_deps = ["eva", "evergreen-build"]
