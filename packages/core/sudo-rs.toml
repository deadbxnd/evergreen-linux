[package]
name = "sudo-rs"
version = "0.2.15"
arch = "x86_64"
description = "Rust implementation of sudo and su"
license = "Apache-2.0 OR MIT"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://crates.io/api/v1/crates/sudo-rs/{version}/download"
sha256 = ""

[build]
script = """
set -eu
cd sudo-rs-$VERSION
cargo install --locked --path . --root "$DESTDIR/usr" --bins
"""

[stage1]
stage = 1
build_deps = ["eva"]
