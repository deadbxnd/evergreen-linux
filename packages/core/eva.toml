[package]
name = "eva"
version = "0.1.0"
arch = "x86_64"
description = "Evergreen Linux package manager"
license = "MIT OR Apache-2.0"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
path = "../.."

[build]
script = """
set -eu
cargo build --release -p eva --target-dir "$SRC/target/stage1"
install -Dm755 "$SRC/target/stage1/release/eva" "$DESTDIR/usr/bin/eva"
"""

[stage1]
stage = 1
build_deps = ["pine"]
