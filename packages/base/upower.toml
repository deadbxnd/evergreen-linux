[package]
name = "upower"
version = "1.91.5"
arch = "x86_64"
description = "upower"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://gitlab.freedesktop.org/upower/upower/-/archive/{tag}/upower-{tag}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dman=false -Ddocs=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["dbus", "glib", "elogind"]
