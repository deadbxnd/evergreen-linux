[package]
name = "cryptsetup"
version = "2.8.1"
arch = "x86_64"
description = "LUKS disk encryption utilities"
license = "GPL-2.0"

[source]
url = "https://www.kernel.org/pub/linux/utils/cryptsetup/v2.8/cryptsetup-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
./configure --prefix=/usr --disable-ssh-token
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["btrfs-progs", "e2fsprogs"]
