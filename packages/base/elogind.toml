[package]
name = "elogind"
version = "257.16"
arch = "x86_64"
description = "Standalone logind-compatible session manager"
license = "LGPL-2.1+"

[source]
url = "https://github.com/elogind/elogind/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dman=false -Dtests=false -Dpamlibdir=/usr/lib/security
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["dbus", "polkit"]
