[package]
name = "fuse"
version = "2.9.9"
arch = "x86_64"
description = "FUSE userspace library (AppImage support)"
license = "LGPL-2.1"

[source]
url = "https://github.com/libfuse/libfuse/releases/download/fuse-{version}/fuse-{version}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
./configure --prefix=/usr
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["pine"]
