[package]
name = "xfsprogs"
version = "6.18.0"
arch = "x86_64"
description = "XFS filesystem utilities"
license = "GPL-2.0"

[source]
url = "https://www.kernel.org/pub/linux/utils/fs/xfs/xfsprogs/xfsprogs-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
./configure --prefix=/usr
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["pine"]
