[package]
name = "linux-lts"
version = "6.18.64"
release = 1
arch = "x86_64"
description = "Evergreen LTS kernel (6.18 longterm)"
license = "GPL-2.0"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-{version}.tar.xz"
sha256 = ""

[provides]
kernel = "6.18.64"

[conflicts]
linux-stable = "*"

[build]
config_file = "../../kernel/config/evergreen.defconfig"
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
cp ../.config .config
KVER=$VERSION
test -f .config
if [ "${EVERGREEN_KERNEL_NO_RUST:-0}" = "1" ]; then ./scripts/config --disable CONFIG_RUST; fi
make olddefconfig
make -j"${JOBS:-4}"
install -Dm755 arch/x86/boot/bzImage "$DESTDIR/boot/vmlinuz-$KVER"
ln -sf "vmlinuz-$KVER" "$DESTDIR/boot/vmlinuz"
install -Dm644 .config "$DESTDIR/boot/config-$KVER"
INSTALL_MOD_PATH="$DESTDIR/usr" make modules_install
"""

[stage1]
stage = 1
build_deps = ["pine-init"]
