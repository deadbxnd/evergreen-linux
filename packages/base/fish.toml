[package]
name = "fish"
version = "4.0.2"
arch = "x86_64"
description = "Friendly interactive shell (default shell)"
license = "GPL-2.0"

[source]
url = "https://github.com/fish-shell/fish-shell/releases/download/{version}/fish-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release
cmake --build build --parallel "${JOBS:-4}"
DESTDIR="$DESTDIR" cmake --install build
ln -sf fish "$DESTDIR/usr/bin/sh-fish"
"""

[stage1]
stage = 1
build_deps = ["pine"]
