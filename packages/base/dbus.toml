[package]
name = "dbus"
version = "1.16.2"
arch = "x86_64"
description = "D-Bus reference message bus"
license = "GPL-2.0-or-later"

[source]
url = "https://dbus.freedesktop.org/releases/dbus/dbus-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dsystemd=false -Dembedded_tests=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["pine"]
