[package]
name = "linux-firmware"
version = "20261019"
arch = "noarch"
description = "Proprietary and open firmware blobs"
license = "Various"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
mkdir -p "$DESTDIR/usr/lib/firmware"
for entry in *; do
    case "$entry" in
        *.tar*|*.xz|*.gz|Makefile|README|COPYING|WHENCE|LICENCE*) continue ;;
    esac
   
cp -a "$entry" "$DESTDIR/usr/lib/firmware/"
done
"""

[stage1]
stage = 1
build_deps = ["linux-lts"]
