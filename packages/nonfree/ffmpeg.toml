[package]
name = "ffmpeg"
version = "7.1.1"
arch = "x86_64"
description = "ffmpeg"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
if [ ! -x ./configure ]; then ./autogen.sh; fi
./configure --prefix=/usr --enable-shared --enable-gpl --enable-libx265 --enable-libvpx --enable-libopus
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["pine", "x265", "libvpx", "opus"]
