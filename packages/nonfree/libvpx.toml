[package]
name = "libvpx"
version = "1.15.2"
arch = "x86_64"
description = "libvpx"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/webmproject/libvpx/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
./configure --prefix=/usr --enable-shared
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["pine"]
