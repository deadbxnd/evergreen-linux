[package]
name = "libdisplay-info"
version = "0.4.0"
arch = "x86_64"
description = "libdisplay-info"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/{version}/libdisplay-info-{version}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["hwdata"]
