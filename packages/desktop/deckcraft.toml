[package]
name = "deckcraft"
version = "0.18.1"
arch = "x86_64"
description = "deckcraft"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/storytold/deckcraft/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
cargo install --locked --path apps/deckcraft --root "$DESTDIR/usr" --bins
"""

[stage1]
stage = 1
build_deps = ["gtk3"]
