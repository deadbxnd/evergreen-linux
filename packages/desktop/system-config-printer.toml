[package]
name = "system-config-printer"
version = "1.5.20"
arch = "x86_64"
description = "system-config-printer"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/OpenPrinting/system-config-printer/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
if [ ! -x ./configure ]; then ./autogen.sh; fi
./configure --prefix=/usr --disable-static
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["cups", "gtk3", "python"]
