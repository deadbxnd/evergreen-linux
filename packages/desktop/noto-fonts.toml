[package]
name = "noto-fonts"
version = "20201206"
arch = "noarch"
description = "noto-fonts"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/googlefonts/noto-fonts/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
mkdir -p "$DESTDIR/usr/share/fonts/noto"
find hinted/ttf -type f -name "*.ttf" -o -type f -name "*.otf" | while read -r font; do
    install -Dm644 "$font" "$DESTDIR/usr/share/fonts/noto/$(basename "$font")"
done
"""

[stage1]
stage = 1
build_deps = ["fontconfig"]
