[package]
name = "xfce4-session"
version = "4.20.4"
arch = "x86_64"
description = "xfce4-session"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://archive.xfce.org/src/xfce/xfce4-session/4.20/xfce4-session-{version}.tar.bz2"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
./configure --prefix=/usr --disable-static
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["libxfce4ui", "xfconf", "dbus", "polkit", "elogind"]
