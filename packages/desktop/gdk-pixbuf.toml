[package]
name = "gdk-pixbuf"
version = "2.42.12"
arch = "x86_64"
description = "gdk-pixbuf"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://download.gnome.org/sources/gdk-pixbuf/2.42/gdk-pixbuf-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dman=false -Dinstalled_tests=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["glib", "cairo"]
