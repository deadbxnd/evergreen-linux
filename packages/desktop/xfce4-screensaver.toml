[package]
name = "xfce4-screensaver"
version = "4.20.2"
arch = "x86_64"
description = "xfce4-screensaver"
license = "GPL-2.0-or-later"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://archive.xfce.org/src/apps/xfce4-screensaver/4.20/xfce4-screensaver-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
if [ ! -x ./configure ]; then ./autogen.sh; fi
./configure --prefix=/usr --disable-static
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["gtk3", "libxfce4ui", "elogind"]
