[package]
name = "papirus-icon-theme"
version = "20260801"
arch = "noarch"
description = "papirus-icon-theme"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/PapirusDevelopmentTeam/papirus-icon-theme/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
mkdir -p "$DESTDIR/usr/share/icons"
for dir in Papirus Papirus-Dark Papirus-Light ePapirus; do
    if [ -d "$dir" ]; then cp -a "$dir" "$DESTDIR/usr/share/icons/"; fi
done
"""

[stage1]
stage = 1
build_deps = ["gtk3"]
