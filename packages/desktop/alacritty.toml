[package]
name = "alacritty"
version = "0.17.0"
arch = "x86_64"
description = "alacritty"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/alacritty/alacritty/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
cargo install --locked --path alacritty --root "$DESTDIR/usr" --bins
"""

[stage1]
stage = 1
build_deps = ["pine", "wayland", "libxkbcommon", "mesa"]
