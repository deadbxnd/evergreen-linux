[package]
name = "mesa"
version = "25.2.7"
arch = "x86_64"
description = "mesa"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://archive.mesa3d.org/mesa-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dplatforms=x11,wayland -Degl=enabled -Dgles1=disabled -Dgles2=enabled -Dvulkan-drivers= -Dgallium-drivers=swrast
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["libdrm", "libx11", "libxshmfence", "wayland", "wayland-protocols"]
