[package]
name = "libxkbcommon"
version = "1.13.2"
arch = "x86_64"
description = "libxkbcommon"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/xkbcommon/libxkbcommon/archive/refs/tags/xkbcommon-{version}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Denable-wayland=false -Dxkb-config-root=/usr/share/X11/xkb -Denable-docs=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["xorgproto", "libxcb"]
