[package]
name = "gtk3"
version = "3.24.43"
arch = "x86_64"
description = "gtk3"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://download.gnome.org/sources/gtk+/3.24/gtk+-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dwayland_backend=false -Dx11_backend=true -Dintrospection=false -Ddemos=false -Dexamples=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["glib", "cairo", "pango", "gdk-pixbuf", "atk", "libx11", "libxi", "libxrandr", "libxcursor", "libxcomposite", "libxdamage", "libxfixes", "libxinerama", "libxkbcommon"]
