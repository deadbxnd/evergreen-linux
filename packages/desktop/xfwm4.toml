[package]
name = "xfwm4"
version = "4.20.0"
arch = "x86_64"
description = "xfwm4"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://archive.xfce.org/src/xfce/xfwm4/4.20/xfwm4-{version}.tar.bz2"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
./configure --prefix=/usr --disable-static
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["libxfce4ui", "libx11", "libxcomposite", "libxrandr", "libxdamage"]
