[package]
name = "kitty"
version = "0.51.0"
arch = "x86_64"
description = "kitty"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/kovidgoyal/kitty/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
python3 setup.py linux-package --prefix="$DESTDIR/usr"
"""

[stage1]
stage = 1
build_deps = ["freetype", "fontconfig", "harfbuzz", "libx11", "wayland", "wayland-protocols"]
