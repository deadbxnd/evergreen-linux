[package]
name = "fribidi"
version = "1.0.18"
arch = "x86_64"
description = "fribidi"
license = "LGPL-2.1-or-later"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/fribidi/fribidi/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Ddocumentation=false -Dtests=false -Dintrospection=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["meson", "ninja"]
