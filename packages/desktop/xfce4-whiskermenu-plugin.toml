[package]
name = "xfce4-whiskermenu-plugin"
version = "2.10.1"
arch = "x86_64"
description = "xfce4-whiskermenu-plugin"
license = "GPL-2.0-or-later"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://archive.xfce.org/src/panel-plugins/xfce4-whiskermenu-plugin/2.10/xfce4-whiskermenu-plugin-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
if [ ! -x ./configure ]; then ./autogen.sh; fi
./configure --prefix=/usr --disable-static
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["gtk3", "xfce4-panel", "libxfce4ui", "garcon"]
