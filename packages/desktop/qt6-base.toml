[package]
name = "qt6-base"
version = "6.11.3"
arch = "x86_64"
description = "qt6-base"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/qt/qtbase/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
cmake --build build --parallel "${JOBS:-4}"
DESTDIR="$DESTDIR" cmake --install build
"""

[stage1]
stage = 1
build_deps = ["fontconfig", "freetype", "harfbuzz", "libx11", "libxcb", "libinput", "libxkbcommon", "openssl", "zlib", "mesa"]
