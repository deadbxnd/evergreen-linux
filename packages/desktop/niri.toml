[package]
name = "niri"
version = "26.04"
arch = "x86_64"
description = "niri"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/niri-wm/niri/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
cargo install --locked --path . --root "$DESTDIR/usr" --bins
"""

[stage1]
stage = 1
build_deps = ["wayland", "wayland-protocols", "libinput", "libxkbcommon", "mesa"]
