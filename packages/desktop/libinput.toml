[package]
name = "libinput"
version = "1.32.0"
arch = "x86_64"
description = "libinput"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://gitlab.freedesktop.org/libinput/libinput/-/archive/{version}/libinput-{version}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dlibwacom=false -Ddocumentation=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["libevdev", "libdrm"]
