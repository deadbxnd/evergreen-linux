[package]
name = "noto-cjk-fonts"
version = "2.003"
arch = "noarch"
description = "noto-cjk-fonts"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/notofonts/noto-cjk/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
mkdir -p "$DESTDIR/usr/share/fonts/noto-cjk"
find . -type f -name "*.otf" -o -name "*.ttc" | while read -r font; do
    install -Dm644 "$font" "$DESTDIR/usr/share/fonts/noto-cjk/$(basename "$font")"
done
"""

[stage1]
stage = 1
build_deps = ["fontconfig"]
