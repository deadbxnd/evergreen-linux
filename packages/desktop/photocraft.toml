[package]
name = "photocraft"
version = "0.23.1"
arch = "x86_64"
description = "photocraft"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/storytold/photocraft/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
cargo install --locked --path apps/photocraft --root "$DESTDIR/usr" --bins
"""

[stage1]
stage = 1
build_deps = ["gtk3", "pixman"]
