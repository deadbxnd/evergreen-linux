[package]
name = "tumbler"
version = "4.20.2"
arch = "x86_64"
description = "tumbler"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://archive.xfce.org/src/xfce/tumbler/4.20/tumbler-{version}.tar.bz2"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
./configure --prefix=/usr --disable-static
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["glib", "gdk-pixbuf"]
