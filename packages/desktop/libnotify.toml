[package]
name = "libnotify"
version = "0.8.3"
arch = "x86_64"
description = "libnotify"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://download.gnome.org/sources/libnotify/0.8/libnotify-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Ddoc=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["glib", "gdk-pixbuf", "dbus"]
