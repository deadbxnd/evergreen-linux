[package]
name = "xdg-desktop-portal-gtk"
version = "1.2.0"
arch = "x86_64"
description = "xdg-desktop-portal-gtk"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/flatpak/xdg-desktop-portal-gtk/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dman=false -Ddocs=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["xdg-desktop-portal", "gtk3"]
