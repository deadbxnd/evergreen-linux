[package]
name = "hicolor-icon-theme"
version = "0.17"
arch = "x86_64"
description = "hicolor-icon-theme"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://icon-theme.freedesktop.org/releases/hicolor-icon-theme-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
true
mkdir -p "$DESTDIR/usr/share/icons/hicolor"
cp -a . "$DESTDIR/usr/share/icons/hicolor/"
"""

[stage1]
stage = 1
build_deps = ["pine"]
