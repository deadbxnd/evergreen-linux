[package]
name = "swaybg"
version = "1.2.2"
arch = "x86_64"
description = "Wallpaper utility for Wayland compositors"
license = "MIT"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/swaywm/swaybg/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Dman-pages=disabled
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["wayland", "wayland-protocols"]
