[package]
name = "mutter"
version = "50.6"
arch = "x86_64"
description = "GNOME mutter"
license = "GPL-2.0-or-later"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/GNOME/mutter/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr --sysconfdir=/etc -Dman=false -Ddocs=false -Dtests=false -Dgtk_doc=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["gtk4", "wayland", "wayland-protocols", "libinput", "libxkbcommon", "mesa", "gnome-desktop", "gsettings-desktop-schemas"]
