[package]
name = "atk"
version = "2.38.0"
arch = "x86_64"
description = "atk"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://download.gnome.org/sources/atk/2.38/atk-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
./configure --prefix=/usr --disable-static
make -j"${JOBS:-4}"
make DESTDIR="$DESTDIR" install
"""

[stage1]
stage = 1
build_deps = ["glib"]
