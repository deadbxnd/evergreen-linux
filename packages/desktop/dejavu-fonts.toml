[package]
name = "dejavu-fonts"
version = "2.37"
arch = "noarch"
description = "dejavu-fonts"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://github.com/dejavu-fonts/dejavu-fonts/archive/refs/tags/{tag}.tar.gz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
mkdir -p "$DESTDIR/usr/share/fonts/dejavu"
find . -type f -name "*.ttf" | while read -r font; do
    install -Dm644 "$font" "$DESTDIR/usr/share/fonts/dejavu/$(basename "$font")"
done
"""

[stage1]
stage = 1
build_deps = ["fontconfig"]
