[package]
name = "pango"
version = "1.56.3"
arch = "x86_64"
description = "pango"
license = "see upstream"
maintainer = "Evergreen Linux <packages@evergreenlinux.org>"

[source]
url = "https://download.gnome.org/sources/pango/1.56/pango-{version}.tar.xz"
sha256 = ""

[build]
script = """
set -eu
cd "$(find . -maxdepth 1 -mindepth 1 -type d | head -1)"
meson setup build --prefix=/usr -Ddocumentation=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

[stage1]
stage = 1
build_deps = ["glib", "harfbuzz", "cairo", "fontconfig"]
