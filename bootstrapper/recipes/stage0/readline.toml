[package]
name = "readline"
version = "8.2"
arch = "any"
description = "Line editing library"
license = "GPL-3.0-or-later"

[source]
url = "https://mirrors.kernel.org/gnu/readline/readline-8.2.tar.gz"
sha256 = "3feb7171f16a84ee82ca18a36d7b9be109a52c04f492a053331d7d1095007c35"

[bootstrap]
stage = 0
pass = 6
build_deps = ["binutils-pass2", "ncurses"]
editions = ["both"]
configure = "./configure --prefix=/usr"
build = "make -j{jobs}"
install = "make DESTDIR='{sysroot}' install"
