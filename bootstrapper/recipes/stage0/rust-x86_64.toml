[package]
name = "rust"
version = "1.85.0"
arch = "x86_64"
description = "Rust toolchain seed (official distribution tarball)"
license = "MIT OR Apache-2.0"

[source]
url = "https://static.rust-lang.org/dist/2025-02-20/rust-1.85.0-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "be4ba7b777100c851ab268e95f70f405d28d7813ba60a9bdcf4e88c88acf8602"

[bootstrap]
stage = 0
pass = 7
build_deps = ["binutils-pass2", "gcc-pass2", "libc", "curl", "ca-certificates"]
editions = ["both"]
configure = ""
build = ""
install = "./install.sh --prefix='{sysroot}/usr' --disable-ldconfig --without=rust-docs --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu"
