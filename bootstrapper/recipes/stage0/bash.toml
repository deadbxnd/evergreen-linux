[package]
name = "bash"
version = "5.2"
arch = "any"
description = "Bourne Again Shell"
license = "GPL-3.0-or-later"

[source]
url = "https://mirrors.kernel.org/gnu/bash/bash-5.2.tar.gz"
sha256 = "a139c166df7ff4471c5e0733051642ee5556c1cc8a4a78f145583c5c81ab32fb"

[bootstrap]
stage = 0
pass = 6
build_deps = ["binutils-pass2", "ncurses", "readline"]
editions = ["both"]
configure = "./configure --prefix=/usr --with-installed-readline"
build = "make -j{jobs}"
install = "make DESTDIR='{sysroot}' install"
