[package]
name = "diffutils"
version = "3.9"
arch = "any"
description = "GNU diffutils"
license = "GPL-3.0-or-later"

[source]
url = "https://mirrors.kernel.org/gnu/diffutils/diffutils-3.9.tar.xz"
sha256 = "d80d3be90a201868de83d78dad3413ad88160cc53bcc36eb9eaf7c20dbf023f1"

[bootstrap]
stage = 0
pass = 6
build_deps = ["binutils-pass2"]
editions = ["both"]
configure = "./configure --prefix=/usr --disable-nls"
build = "make -j{jobs}"
install = "make DESTDIR='{sysroot}' install"
