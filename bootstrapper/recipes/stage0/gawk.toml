[package]
name = "gawk"
version = "5.3.0"
arch = "any"
description = "GNU gawk"
license = "GPL-3.0-or-later"

[source]
url = "https://mirrors.kernel.org/gnu/gawk/gawk-5.3.0.tar.xz"
sha256 = "ca9c16d3d11d0ff8c69d79dc0b47267e1329a69b39b799895604ed447d3ca90b"

[bootstrap]
stage = 0
pass = 6
build_deps = ["binutils-pass2"]
editions = ["both"]
configure = "./configure --prefix=/usr --disable-nls"
build = "make -j{jobs}"
install = "make DESTDIR='{sysroot}' install"
