[package]
name = "zlib"
version = "1.3"
arch = "any"
description = "zlib compression library"
license = "Zlib"

[source]
url = "https://zlib.net/fossils/zlib-1.3.tar.gz"
sha256 = "ff0ba4c292013dbc27530b3a81e1f9a813cd39de01ca5e0f8bf355702efa593e"

[bootstrap]
stage = 0
pass = 6
build_deps = ["binutils-pass2"]
editions = ["both"]
configure = "./configure --prefix=/usr --shared"
build = "make -j{jobs}"
install = "make DESTDIR='{sysroot}' install"
