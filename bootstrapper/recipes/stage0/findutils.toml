[package]
name = "findutils"
version = "4.9.0"
arch = "any"
description = "GNU findutils"
license = "GPL-3.0-or-later"

[source]
url = "https://mirrors.kernel.org/gnu/findutils/findutils-4.9.0.tar.xz"
sha256 = "a2bfb8c09d436770edc59f50fa483e785b161a3b7b9d547573cb08065fd462fe"

[bootstrap]
stage = 0
pass = 6
build_deps = ["binutils-pass2"]
editions = ["both"]
configure = "./configure --prefix=/usr --disable-nls"
build = "make -j{jobs}"
install = "make DESTDIR='{sysroot}' install"
